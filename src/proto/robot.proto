syntax = "proto3";

package robot;

service robot_service {
  rpc init_generic_request (generic_message) returns (response_message);
  rpc cancel_generic_request (generic_message) returns (response_message);
}

// A generic message for sending data with a session ID.
message generic_message {
  string session_id = 1;
  int32 data = 2;
}

// A standard response message indicating success or failure.
message response_message {
  string session_id = 1;
  bool success = 2;
}